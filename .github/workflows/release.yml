name: Release

# Cut a GitHub Release whenever a version tag (vX.Y.Z) is pushed. The release
# body is the matching section of CHANGELOG.md. No package publishing.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract CHANGELOG notes for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Literal index() matching (no regex) so version brackets need no escaping.
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            printf "Release %s\n" "$GITHUB_REF_NAME" > release_notes.md
          fi
          echo "----- release notes -----"
          cat release_notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md
