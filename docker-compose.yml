# Run Husk in a container: a local-first, single-user development debugger for the
# agent you're building. Ingest is loopback-only — the port is bound to 127.0.0.1,
# so only the agent running on this host can stream traces in. Husk cannot be
# pointed at production by design.
#
#   docker compose up -d
#
# Then open http://127.0.0.1:7654 and connect your agent (one line — see the Studio's
# Connect tab). Everything stays on this machine; the only outbound calls are the
# automatic debugger's, to the provider you configure (Regolo.ai by default — EU,
# GDPR, zero retention).
services:
  husk:
    image: ghcr.io/husk-ai-team/husk-ai:latest
    # Or build locally instead of pulling:
    # build: .
    container_name: husk
    ports:
      - "127.0.0.1:7654:7654" # loopback-only: reachable from this host, not the network
    environment:
      HUSK_HOME: /data # SQLite store + the BYOK key live here, on the husk-data volume
    volumes:
      - husk-data:/data
    restart: unless-stopped

volumes:
  husk-data:
